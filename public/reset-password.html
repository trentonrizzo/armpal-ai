<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ArmPal — Reset password</title>
    <meta name="theme-color" content="#000000" />
    <!--
      Supabase → Authentication → URL Configuration → Redirect URLs:
      https://www.armpal.net/reset-password.html
      https://armpal.net/reset-password.html
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      .wrap {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        flex: 1;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #0b0b0c;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 22px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 28px;
        font-weight: 900;
        text-align: center;
        letter-spacing: -0.02em;
      }
      label {
        display: block;
        font-size: 13px;
        color: #aaa;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        margin-bottom: 12px;
        border-radius: 12px;
        background: #111;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 16px;
      }
      button.primary {
        width: 100%;
        padding: 14px 16px;
        margin-top: 8px;
        border: none;
        border-radius: 14px;
        background: #ff2f2f;
        color: #fff;
        font-weight: 900;
        font-size: 16px;
        cursor: pointer;
      }
      button.primary:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }
      .err {
        background: rgba(255, 47, 47, 0.15);
        border: 1px solid rgba(255, 47, 47, 0.35);
        color: #fff;
        padding: 12px 14px;
        border-radius: 12px;
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.45;
      }
      .ok {
        font-size: 16px;
        line-height: 1.5;
        font-weight: 600;
        text-align: center;
        margin: 0;
      }
      .hidden {
        display: none !important;
      }
      .debug-footer {
        margin-top: auto;
        padding: 10px 16px 16px;
        font-size: 11px;
        color: #666;
        text-align: center;
        width: 100%;
        max-width: 520px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" id="panel-loading">
        <h1>ArmPal</h1>
      </div>

      <div class="card hidden" id="panel-form">
        <h1>ArmPal</h1>
        <div id="msg" class="hidden"></div>
        <label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" />
        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" />
        <button type="button" class="primary" id="btn">Update Password</button>
      </div>

      <div class="card hidden" id="panel-error">
        <h1>ArmPal</h1>
        <p class="ok" id="err-text" style="color: #aaa; font-weight: 400; margin-bottom: 16px">
          This reset link is invalid or has expired.
        </p>
        <button type="button" class="primary" id="btn-home">Back to sign in</button>
      </div>

      <div class="card hidden" id="panel-success">
        <h1>ArmPal</h1>
        <p class="ok">
          Password updated successfully. You may now close this tab and return to ArmPal.
        </p>
      </div>
    </div>

    <p class="debug-footer">ArmPal Password Reset Page Loaded</p>

    <script type="module">
      /* Required: unregister all service workers (also awaited below for completion). */
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
      }

      try {
        const u = new URL(window.location.href);
        if (u.searchParams.has("__ap_nc")) {
          u.searchParams.delete("__ap_nc");
          history.replaceState(null, "", u.pathname + u.search + u.hash);
        }
      } catch {
        /* ignore */
      }

      if ("serviceWorker" in navigator) {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        } catch {
          /* ignore */
        }
      }
      if ("caches" in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        } catch {
          /* ignore */
        }
      }
      /* One reload if a controller was still attached (frees client from old SW). */
      try {
        const k = "armpal_reset_sw_cleared_v1";
        if (!sessionStorage.getItem(k) && navigator.serviceWorker?.controller) {
          sessionStorage.setItem(k, "1");
          window.location.reload();
        }
      } catch {
        /* ignore */
      }

      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");

      const SUPABASE_URL = "https://ewlwkasjtwsfemqnkrkp.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3bHdrYXNqdHdzZmVtcW5rcmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4ODM3MjQsImV4cCI6MjA3ODQ1OTcyNH0.mG3gJVhSZiGTZx6MFwV0GYq5Xon6dCNsSQLYd230itc";

      const resetAuthStorage = {
        getItem: (key) => {
          try {
            return sessionStorage.getItem(`armpal_reset_${key}`);
          } catch {
            return null;
          }
        },
        setItem: (key, value) => {
          try {
            sessionStorage.setItem(`armpal_reset_${key}`, value);
          } catch {
            /* ignore */
          }
        },
        removeItem: (key) => {
          try {
            sessionStorage.removeItem(`armpal_reset_${key}`);
          } catch {
            /* ignore */
          }
        },
      };

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce",
          storage: resetAuthStorage,
          storageKey: "sb-reset-page",
        },
      });

      const $ = (id) => document.getElementById(id);

      function show(id) {
        ["panel-loading", "panel-form", "panel-error", "panel-success"].forEach((pid) => {
          $(pid).classList.toggle("hidden", pid !== id);
        });
      }

      function friendlyError(err) {
        const raw = (err && (err.message || String(err))) || "";
        const m = String(raw).toLowerCase();
        if (!m) return "We couldn’t update your password. Please try again.";
        if (m.includes("no_session") || m.includes("timeout")) {
          return "This reset link is invalid or has expired. Request a new one from ArmPal.";
        }
        if (m.includes("session") || m.includes("expired") || m.includes("jwt") || m.includes("invalid")) {
          return "This reset link has expired or is no longer valid. Request a new one from ArmPal.";
        }
        if (m.includes("same") && m.includes("password")) {
          return "Choose a new password that differs from your current one.";
        }
        if (m.includes("weak") || m.includes("least") || m.includes("short")) {
          return "Use a longer password (at least 6 characters).";
        }
        return "We couldn’t update your password. Request a new reset link and try again.";
      }

      function showMsg(text, isError) {
        const el = $("msg");
        el.textContent = text;
        el.className = isError ? "err" : "hidden";
        if (isError) el.classList.remove("hidden");
      }

      function hashParams() {
        const raw = (window.location.hash || "").replace(/^#/, "");
        try {
          return new URLSearchParams(raw);
        } catch {
          return new URLSearchParams();
        }
      }

      async function establishRecoverySession() {
        const href = window.location.href;
        const url = new URL(href);

        const code = url.searchParams.get("code");
        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(href);
          if (error) throw error;
          return;
        }

        const qAt = url.searchParams.get("access_token");
        const qRt = url.searchParams.get("refresh_token");
        if (qAt && qRt) {
          const { error } = await supabase.auth.setSession({
            access_token: qAt,
            refresh_token: qRt,
          });
          if (error) throw error;
          return;
        }

        const hp = hashParams();
        const hAt = hp.get("access_token");
        const hRt = hp.get("refresh_token");
        const hType = hp.get("type");
        if (hAt && hRt && (hType === "recovery" || !hType)) {
          const { error } = await supabase.auth.setSession({
            access_token: hAt,
            refresh_token: hRt,
          });
          if (error) throw error;
          return;
        }

        const hash = url.hash || "";
        if (
          hash.includes("access_token") ||
          hash.includes("refresh_token") ||
          hash.includes("type=recovery")
        ) {
          await new Promise((resolve, reject) => {
            let timer;
            const { data } = supabase.auth.onAuthStateChange((event, session) => {
              if (
                session &&
                (event === "PASSWORD_RECOVERY" ||
                  event === "SIGNED_IN" ||
                  event === "INITIAL_SESSION")
              ) {
                clearTimeout(timer);
                try {
                  data.subscription.unsubscribe();
                } catch {
                  /* ignore */
                }
                resolve();
              }
            });
            timer = setTimeout(() => {
              try {
                data.subscription.unsubscribe();
              } catch {
                /* ignore */
              }
              reject(new Error("timeout"));
            }, 12000);
          });
          const { data, error } = await supabase.auth.getSession();
          if (error) throw error;
          if (!data.session) throw new Error("no_session");
          return;
        }

        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (!data.session) throw new Error("no_session");
      }

      $("btn-home").addEventListener("click", () => {
        window.location.assign("/");
      });

      try {
        await establishRecoverySession();
      } catch (e) {
        $("err-text").textContent = friendlyError(e);
        show("panel-error");
        throw e;
      }

      show("panel-form");

      $("btn").addEventListener("click", async () => {
        const pw = $("pw").value || "";
        const pw2 = $("pw2").value || "";
        showMsg("", false);

        if (!pw.trim() || !pw2.trim()) {
          showMsg("Enter and confirm your new password.", true);
          return;
        }
        if (pw.length < 6) {
          showMsg("Password must be at least 6 characters.", true);
          return;
        }
        if (pw !== pw2) {
          showMsg("Passwords do not match.", true);
          return;
        }

        const btn = $("btn");
        btn.disabled = true;
        const { error } = await supabase.auth.updateUser({ password: pw });
        if (error) {
          showMsg(friendlyError(error), true);
          btn.disabled = false;
          return;
        }
        try {
          await supabase.auth.signOut();
        } catch {
          /* ignore */
        }
        show("panel-success");
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ArmPal — Password reset</title>
    <script>
      (function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
      })();
    </script>
    <meta name="theme-color" content="#000000" />
    <!-- No ap-spa-shell meta: this document is NOT the React app. -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .debug-banner {
        background: #1a1a1a;
        color: #0f0;
        font-weight: 800;
        font-size: 13px;
        text-align: center;
        padding: 10px 12px;
        border-bottom: 2px solid #0f0;
        letter-spacing: 0.04em;
      }
      .wrap {
        min-height: calc(100dvh - 44px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #0b0b0c;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 22px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 28px;
        font-weight: 900;
        text-align: center;
      }
      label {
        display: block;
        font-size: 13px;
        color: #aaa;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        margin-bottom: 12px;
        border-radius: 12px;
        background: #111;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 16px;
      }
      button.update {
        width: 100%;
        padding: 14px 16px;
        margin-top: 8px;
        border: none;
        border-radius: 14px;
        background: #ff2f2f;
        color: #fff;
        font-weight: 900;
        font-size: 16px;
        cursor: pointer;
      }
      button.update:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }
      .err {
        background: rgba(255, 47, 47, 0.15);
        border: 1px solid rgba(255, 47, 47, 0.35);
        padding: 12px 14px;
        border-radius: 12px;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .ok {
        font-size: 16px;
        line-height: 1.5;
        font-weight: 600;
        text-align: center;
        margin: 0;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="debug-banner" id="debug-banner">ARM PAL STANDALONE RESET PAGE</div>

    <div class="wrap">
      <div class="card" id="panel-loading">
        <h1>ArmPal</h1>
        <p class="ok" style="color: #aaa; font-weight: 400">Preparing secure reset…</p>
      </div>

      <div class="card hidden" id="panel-form">
        <h1>ArmPal</h1>
        <div id="msg" class="hidden"></div>
        <label for="pw">New Password</label>
        <input id="pw" type="password" autocomplete="new-password" />
        <label for="pw2">Confirm Password</label>
        <input id="pw2" type="password" autocomplete="new-password" />
        <button type="button" class="update" id="btn">Update Password</button>
      </div>

      <div class="card hidden" id="panel-error">
        <h1>ArmPal</h1>
        <p class="ok" id="err-text" style="color: #aaa; font-weight: 400; margin-bottom: 16px">
          This reset link is invalid or has expired.
        </p>
        <button type="button" class="update" id="btn-home">Close</button>
      </div>

      <div class="card hidden" id="panel-success">
        <h1>ArmPal</h1>
        <p class="ok">Password updated successfully. You may now return to ArmPal.</p>
      </div>
    </div>

    <script>
      (function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
      })();
    </script>

    <script type="module">
      async function killSwAndCachesAndFlags() {
        if ("serviceWorker" in navigator) {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          } catch (_) {}
        }
        if ("caches" in window) {
          try {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          } catch (_) {}
        }
        try {
          sessionStorage.removeItem("armpal_password_recovery_flow");
          sessionStorage.removeItem("armpal_reset_sw_cleared_v1");
          const toRemove = [];
          for (let i = 0; i < sessionStorage.length; i++) {
            const k = sessionStorage.key(i);
            if (k && k.startsWith("armpal_reset_")) toRemove.push(k);
          }
          toRemove.forEach((k) => sessionStorage.removeItem(k));
        } catch (_) {}
      }

      await killSwAndCachesAndFlags();

      try {
        const u = new URL(window.location.href);
        if (u.searchParams.has("__ap_nc")) {
          u.searchParams.delete("__ap_nc");
          history.replaceState(null, "", u.pathname + u.search + u.hash);
        }
      } catch (_) {}

      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");

      const SUPABASE_URL = "https://ewlwkasjtwsfemqnkrkp.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3bHdrYXNqdHdzZmVtcW5rcmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4ODM3MjQsImV4cCI6MjA3ODQ1OTcyNH0.mG3gJVhSZiGTZx6MFwV0GYq5Xon6dCNsSQLYd230itc";

      const resetStorage = {
        getItem: (key) => {
          try {
            return sessionStorage.getItem("armpal_pw_standalone_" + key);
          } catch {
            return null;
          }
        },
        setItem: (key, value) => {
          try {
            sessionStorage.setItem("armpal_pw_standalone_" + key, value);
          } catch {}
        },
        removeItem: (key) => {
          try {
            sessionStorage.removeItem("armpal_pw_standalone_" + key);
          } catch {}
        },
      };

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce",
          storage: resetStorage,
          storageKey: "sb-pw-standalone",
        },
      });

      const $ = (id) => document.getElementById(id);

      function show(id) {
        ["panel-loading", "panel-form", "panel-error", "panel-success"].forEach((pid) => {
          $(pid).classList.toggle("hidden", pid !== id);
        });
      }

      function friendly(err) {
        const raw = (err && (err.message || String(err))) || "";
        const m = String(raw).toLowerCase();
        if (!m) return "Could not update password. Try again.";
        if (m.includes("no_session") || m.includes("timeout")) return "This link expired. Request a new reset email.";
        if (m.includes("session") || m.includes("expired") || m.includes("jwt") || m.includes("invalid"))
          return "This link is no longer valid. Request a new reset email.";
        if (m.includes("same") && m.includes("password")) return "Choose a different password than your current one.";
        if (m.includes("weak") || m.includes("least") || m.includes("short")) return "Use at least 6 characters.";
        return "Could not update password. Request a new reset link.";
      }

      function showMsg(text, isErr) {
        const el = $("msg");
        el.textContent = text;
        el.className = isErr ? "err" : "hidden";
        if (isErr) el.classList.remove("hidden");
      }

      function parseHash() {
        const raw = (window.location.hash || "").replace(/^#/, "");
        try {
          return new URLSearchParams(raw);
        } catch {
          return new URLSearchParams();
        }
      }

      async function establishSession() {
        const href = window.location.href;
        const url = new URL(href);

        if (url.searchParams.get("code")) {
          const { error } = await supabase.auth.exchangeCodeForSession(href);
          if (error) throw error;
          return;
        }

        const qAt = url.searchParams.get("access_token");
        const qRt = url.searchParams.get("refresh_token");
        if (qAt && qRt) {
          const { error } = await supabase.auth.setSession({ access_token: qAt, refresh_token: qRt });
          if (error) throw error;
          return;
        }

        const hp = parseHash();
        const hAt = hp.get("access_token");
        const hRt = hp.get("refresh_token");
        if (hAt && hRt) {
          const { error } = await supabase.auth.setSession({ access_token: hAt, refresh_token: hRt });
          if (error) throw error;
          return;
        }

        const hash = url.hash || "";
        if (hash.includes("access_token") || hash.includes("refresh_token") || hash.includes("type=recovery")) {
          await new Promise((resolve, reject) => {
            let timer;
            const { data } = supabase.auth.onAuthStateChange((event, session) => {
              if (
                session &&
                (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")
              ) {
                clearTimeout(timer);
                try {
                  data.subscription.unsubscribe();
                } catch {}
                resolve();
              }
            });
            timer = setTimeout(() => {
              try {
                data.subscription.unsubscribe();
              } catch {}
              reject(new Error("timeout"));
            }, 15000);
          });
          const { data, error } = await supabase.auth.getSession();
          if (error) throw error;
          if (!data.session) throw new Error("no_session");
          return;
        }

        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (!data.session) throw new Error("no_session");
      }

      $("btn-home").addEventListener("click", () => {
        window.close();
      });

      try {
        await establishSession();
      } catch (e) {
        $("err-text").textContent = friendly(e);
        show("panel-error");
        throw e;
      }

      show("panel-form");

      $("btn").addEventListener("click", async () => {
        const pw = ($("pw").value || "").trim();
        const pw2 = ($("pw2").value || "").trim();
        showMsg("", false);
        if (!pw || !pw2) {
          showMsg("Enter and confirm your password.", true);
          return;
        }
        if (pw.length < 6) {
          showMsg("Password must be at least 6 characters.", true);
          return;
        }
        if (pw !== pw2) {
          showMsg("Passwords do not match.", true);
          return;
        }
        const btn = $("btn");
        btn.disabled = true;
        const { error } = await supabase.auth.updateUser({ password: pw });
        if (error) {
          showMsg(friendly(error), true);
          btn.disabled = false;
          return;
        }
        try {
          await supabase.auth.signOut();
        } catch {}
        try {
          history.replaceState(null, "", window.location.pathname);
        } catch {}
        show("panel-success");
      });
    </script>
  </body>
</html>
